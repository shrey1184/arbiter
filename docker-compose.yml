services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports: ["11434:11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama: {condition: service_healthy}
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull llama3.1:8b"]   # add qwen2.5:7b / mistral:7b for ollama-only mode
    restart: "no"

  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - arbiter_data:/data
    depends_on:
      ollama-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      ARBITER_API_URL: http://api:8000
      ARBITER_API_KEY: ${ARBITER_API_KEY:-dev-key-change-me}
    ports: ["8501:8501"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  ollama_models:
  arbiter_data:
