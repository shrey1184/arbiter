[project]
name = "arbiter"
version = "0.1.0"
description = "Multi-agent LLM output arbitration system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "langgraph>=0.2",
  "instructor>=1.4",
  "openai>=1.40",
  "anthropic>=0.34",
  "tenacity>=8.5",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "streamlit>=1.37",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
